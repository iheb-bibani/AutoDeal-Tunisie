[tool.pytest.ini_options]
# test_modele.py (racine) est un script de diagnostic, pas une suite pytest.
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:shap.*",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
# Erreurs réelles uniquement : syntaxe, noms indéfinis, imports inutiles,
# bugs fréquents (bugbear). Le style reste libre.
select = ["E9", "F", "B006", "B008", "B023", "B904", "PLE"]
ignore = [
    "B008",  # Depends() en argument par défaut : idiome FastAPI
    "B904",  # raise ... from : à migrer progressivement
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"utils/*.py" = ["E402"]
