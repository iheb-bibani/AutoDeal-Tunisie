name: CI

# CI du CODE (separee du pipeline de donnees dans scraping.yml).
# Lance toute la suite pytest + les controles de coherence du depot.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & coherence
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests pytest
        run: python -m pytest tests/ -q

      - name: Coherence du depot (config / modele pickle)
        run: python verifier_sync.py

      - name: Lint Ruff (informatif)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --output-format=github
