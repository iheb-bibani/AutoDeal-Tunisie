name: CI

# CI du CODE (séparée du pipeline de données dans scraping.yml).
# Vérifie toute l'architecture V2 : frontend Streamlit, routes, FastAPI,
# core data/ML, services, scrapers et tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & cohérence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: |
          python -m compileall -q \
            app.py product_views.py config.py logger.py verifier_sync.py \
            backend core services scrapers utils views web tests

      - name: Smoke test des routes V2 et de FastAPI
        run: |
          python - <<'PY'
          from web.routes import ROUTES, BY_PATH
          from backend.main import app

          assert ROUTES, "Aucune route frontend déclarée"
          assert len(BY_PATH) == len(ROUTES), "URLs frontend dupliquées"
          paths = {route.path for route in app.routes}
          for required in {"/health", "/api/v1/market/summary", "/api/v1/listings", "/api/v1/deals", "/api/v1/valuation/comparables"}:
              assert required in paths, f"Endpoint FastAPI manquant: {required}"
          print(f"OK: {len(ROUTES)} routes frontend et {len(paths)} routes FastAPI")
          PY

      - name: Tests pytest
        run: python -m pytest tests/ -q

      - name: Cohérence du dépôt (config / modèle / contrats)
        run: python verifier_sync.py

      - name: Lint Ruff (informatif)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --output-format=github
