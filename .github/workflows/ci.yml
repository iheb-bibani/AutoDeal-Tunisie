name: CI

# CI du CODE (séparée du pipeline de données dans scraping.yml).
# Lance la compilation Python, toute la suite pytest et les contrôles de
# cohérence du dépôt.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & cohérence
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: |
          python -m compileall -q app.py product_views.py config.py logger.py core services scrapers utils tests

      - name: Tests pytest
        run: python -m pytest tests/ -q

      - name: Cohérence du dépôt (config / modèle / contrats)
        run: python verifier_sync.py

      - name: Lint Ruff (informatif)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --output-format=github
