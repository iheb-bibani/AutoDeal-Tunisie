name: CI

# CI du CODE (séparée du pipeline de données dans scraping.yml).
# Lance les 66 tests + la cohérence du dépôt à chaque push et pull request.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & cohérence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pas d'installation des navigateurs Playwright : les tests n'en ont pas besoin.

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

      - name: Cohérence du dépôt (config ↔ modèle picklé)
        run: python verifier_sync.py

      - name: Lint (ruff — informatif, ne bloque pas)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . --output-format=github
