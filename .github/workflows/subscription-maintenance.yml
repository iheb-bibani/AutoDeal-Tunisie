name: Subscription maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Le job détient la clé service-role : jeton GitHub en lecture seule, et pas
# deux runs horaires en parallèle (double notification / double expiration).
permissions:
  contents: read

concurrency:
  group: subscription-maintenance
  cancel-in-progress: false

jobs:
  maintain-subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "supabase>=2.18,<3" "requests>=2.31"
      - run: python utils/subscription_maintenance.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Nouveau nom recommandé + ancien nom gardé pour compatibilité.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
