name: Scraping quotidien

on:
  schedule:
    # Minuit heure tunisienne (UTC+1, pas de changement d'heure)
    - cron: '0 23 * * *'
  workflow_dispatch:
  # Relance automatiquement un run de validation lorsqu'on modifie
  # l'orchestrateur, le quality gate ou ce workflow.
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'core/quality_gate.py'
      - '.github/workflows/scraping.yml'

# Un seul pipeline data à la fois. Un correctif poussé pendant un run attendra
# le run précédent au lieu de l'annuler et de laisser des fichiers partiels.
concurrency:
  group: scraping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m patchright install chromium

      - name: Installer xvfb et Chrome stable
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m patchright install chrome || true

      - name: Lancer le pipeline
        id: pipeline
        env:
          # Garde-fous : un site externe ne peut plus bloquer tout le runner.
          AUTODEAL_SCRAPER_TIMEOUT_SECONDS: '2700'
          AUTODEAL_STEP_TIMEOUT_SECONDS: '1200'
          AUTODEAL_MODEL_TIMEOUT_SECONDS: '5400'
        run: xvfb-run -a python main.py

      - name: Afficher le manifeste du pipeline
        if: always()
        run: |
          echo '--- pipeline_run.json ---'
          cat data/processed/pipeline_run.json 2>/dev/null || echo 'Manifeste indisponible'

      - name: Quality gate
        id: verif
        if: steps.pipeline.outcome == 'success'
        run: python core/quality_gate.py

      - name: Suivi des performances
        if: steps.verif.outcome == 'success'
        run: python core/suivi_performance.py

      - name: Envoyer les alertes Telegram
        if: steps.verif.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python utils/send_telegram.py

      - name: Envoyer les alertes personnalisées
        if: steps.verif.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python utils/send_personalized_alerts.py

      - name: Enregistrer les nouvelles données dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.verif.outcome }}" = "success" ]; then
            echo "Pipeline complet : publication de raw + processed + models"
            git add data/raw data/processed data/models
          else
            echo "Pipeline/quality gate en échec : publication de data/raw uniquement"
            git checkout -- data/processed data/models 2>/dev/null || true
            git clean -fd data/processed data/models || true
            git add data/raw
          fi

          if git diff --cached --quiet; then
            echo "Rien à publier"
            exit 0
          fi

          git commit -m "Scraping automatique $(date -u '+%Y-%m-%d %H:%M UTC')"

          for TENTATIVE in 1 2 3 4 5; do
            echo "Publication, tentative $TENTATIVE/5..."
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                echo "Publication réussie"
                exit 0
              fi
              echo "Push rejeté, nouvelle tentative"
            else
              echo "Rebase impossible, abandon de la tentative"
              git rebase --abort || true
            fi
            sleep $(( RANDOM % 10 + 5 ))
          done

          echo "::error::Échec de publication après 5 tentatives"
          exit 1
